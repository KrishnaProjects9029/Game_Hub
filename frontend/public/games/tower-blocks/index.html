<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Tower Blocks Stacker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html {
      width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #030712 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    #game-container {
      position: relative; width: 100%; height: 100%;
      max-width: 480px; max-height: 800px;
      display: flex; flex-direction: column;
    }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .hud {
      position: absolute; top: 20px; left: 0; right: 0;
      display: flex; justify-content: center; pointer-events: none; z-index: 10;
    }
    .score-badge {
      font-size: 54px; font-weight: 900; color: #f8fafc;
      text-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
      font-variant-numeric: tabular-nums;
    }
    #modal {
      position: absolute; inset: 0; background: rgba(3, 7, 18, 0.88);
      backdrop-filter: blur(8px); display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 30; text-align: center;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud">
      <div id="score" class="score-badge">0</div>
    </div>
    <canvas id="c"></canvas>

    <div id="modal">
      <div style="font-size: 50px; margin-bottom: 8px;">🏗️</div>
      <h1 style="font-size: 32px; font-weight: 900; color: #a855f7; margin-bottom: 6px;">TOWER COLLAPSED</h1>
      <p style="color: #94a3b8; font-size: 16px; margin-bottom: 20px;">Floors Stacked: <span id="final-floors" style="color: #38bdf8; font-weight: bold;">0</span></p>
      <button id="retry-btn" style="padding: 12px 36px; background: #a855f7; color: #fff; border: none; font-size: 16px; font-weight: bold; border-radius: 999px; cursor: pointer; box-shadow: 0 0 20px rgba(168,85,247,0.5);">STACK AGAIN</button>
    </div>
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function snd(f, d = 0.1, type = 'sine') {
      try {
        if (!actx) actx = new AudioCtx();
        if (actx.state === 'suspended') actx.resume();
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, actx.currentTime);
        g.gain.setValueAtTime(0.12, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d);
        o.connect(g); g.connect(actx.destination);
        o.start(); o.stop(actx.currentTime + d);
      } catch(e) {}
    }

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const modal = document.getElementById('modal');
    const finalFloors = document.getElementById('final-floors');
    const retryBtn = document.getElementById('retry-btn');

    let W = 0, H = 0;
    function resize() {
      const r = canvas.getBoundingClientRect();
      W = canvas.width = r.width * (window.devicePixelRatio || 1);
      H = canvas.height = r.height * (window.devicePixelRatio || 1);
    }
    window.addEventListener('resize', resize);
    resize();

    const BLOCK_H = 26;
    let stack = [];
    let currentBlock = { x: 0, w: 180, dir: 1, speed: 4 };
    let cameraY = 0;
    let score = 0;
    let isOver = false;

    function getColor(floor) {
      const hue = (floor * 12 + 200) % 360;
      return `hsl(${hue}, 80%, 55%)`;
    }

    function init() {
      resize();
      stack = [
        { x: (W - 200) / 2, w: 200, color: getColor(0) }
      ];
      currentBlock = { x: 0, w: 200, dir: 1, speed: 4 };
      cameraY = 0;
      score = 0;
      scoreEl.textContent = '0';
      isOver = false;
      modal.style.display = 'none';
    }

    function placeBlock() {
      if (isOver) return;

      const top = stack[stack.length - 1];
      const diff = currentBlock.x - top.x;

      if (Math.abs(diff) < 3) {
        // Perfect match
        currentBlock.x = top.x;
        snd(720 + score * 20, 0.15, 'triangle');
      } else if (Math.abs(diff) >= currentBlock.w) {
        // Complete miss -> Game over
        isOver = true;
        snd(160, 0.4, 'sawtooth');
        finalFloors.textContent = score;
        modal.style.display = 'flex';
        return;
      } else {
        // Slicing
        if (diff > 0) {
          currentBlock.w -= diff;
        } else {
          currentBlock.x = top.x;
          currentBlock.w += diff;
        }
        snd(440 + score * 15, 0.1, 'sine');
      }

      stack.push({
        x: currentBlock.x,
        w: currentBlock.w,
        color: getColor(stack.length)
      });

      score++;
      scoreEl.textContent = score;

      // Reset moving block for next floor
      currentBlock = {
        x: Math.random() < 0.5 ? 0 : W - currentBlock.w,
        w: currentBlock.w,
        dir: Math.random() < 0.5 ? 1 : -1,
        speed: 4 + Math.min(6, score * 0.15)
      };
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); placeBlock(); }
    });
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      placeBlock();
    });
    retryBtn.onclick = init;

    function update() {
      if (isOver) return;

      currentBlock.x += currentBlock.dir * currentBlock.speed;
      if (currentBlock.x <= 0) {
        currentBlock.x = 0;
        currentBlock.dir = 1;
      } else if (currentBlock.x + currentBlock.w >= W) {
        currentBlock.x = W - currentBlock.w;
        currentBlock.dir = -1;
      }

      // Smooth camera scroll
      const targetCamY = Math.max(0, (stack.length - 8) * BLOCK_H);
      cameraY += (targetCamY - cameraY) * 0.1;
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      const baseY = H - 80 + cameraY;

      // Draw Stack
      for (let i = 0; i < stack.length; i++) {
        const b = stack[i];
        const y = baseY - i * BLOCK_H;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, y, b.w, BLOCK_H - 2);

        // Highlight top rim
        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.fillRect(b.x, y, b.w, 3);
      }

      // Draw Moving Block
      if (!isOver) {
        const moveY = baseY - stack.length * BLOCK_H;
        ctx.fillStyle = getColor(stack.length);
        ctx.fillRect(currentBlock.x, moveY, currentBlock.w, BLOCK_H - 2);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.fillRect(currentBlock.x, moveY, currentBlock.w, 4);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    init();
    loop();
  </script>
</body>
</html>
