<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Alien Invasion Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html {
      width: 100%; height: 100%;
      background: #020617; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    #game-container {
      position: relative; width: 100%; height: 100%;
      max-width: 480px; max-height: 760px;
      display: flex; flex-direction: column;
    }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .hud {
      position: absolute; top: 12px; left: 16px; right: 16px;
      display: flex; justify-content: space-between;
      font-size: 16px; font-weight: 800; color: #38bdf8; z-index: 10;
    }
    #modal {
      position: absolute; inset: 0; background: rgba(2, 6, 23, 0.9);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 30; text-align: center;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud">
      <div>SCORE: <span id="score" style="color: #fff;">0</span></div>
      <div>WAVE: <span id="wave" style="color: #f59e0b;">1</span></div>
      <div>SHIELD: <span id="shield" style="color: #22c55e;">100%</span></div>
    </div>
    <canvas id="c"></canvas>

    <div id="modal">
      <div style="font-size: 50px; margin-bottom: 8px;">🛸</div>
      <h1 style="font-size: 32px; font-weight: 900; color: #ef4444; margin-bottom: 8px;">MOTHERSHIP INVASION</h1>
      <p style="color: #94a3b8; font-size: 16px; margin-bottom: 20px;">Final Score: <span id="final-score" style="color: #38bdf8; font-weight: bold;">0</span></p>
      <button id="retry-btn" style="padding: 12px 36px; background: #38bdf8; color: #000; border: none; font-size: 16px; font-weight: bold; border-radius: 999px; cursor: pointer;">DEFEND AGAIN</button>
    </div>
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function snd(f, d = 0.08, type = 'square') {
      try {
        if (!actx) actx = new AudioCtx();
        if (actx.state === 'suspended') actx.resume();
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, actx.currentTime);
        g.gain.setValueAtTime(0.08, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d);
        o.connect(g); g.connect(actx.destination);
        o.start(); o.stop(actx.currentTime + d);
      } catch(e) {}
    }

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const waveEl = document.getElementById('wave');
    const shieldEl = document.getElementById('shield');
    const modal = document.getElementById('modal');
    const finalScore = document.getElementById('final-score');
    const retryBtn = document.getElementById('retry-btn');

    let W = 0, H = 0;
    function resize() {
      const r = canvas.getBoundingClientRect();
      W = canvas.width = r.width * (window.devicePixelRatio || 1);
      H = canvas.height = r.height * (window.devicePixelRatio || 1);
    }
    window.addEventListener('resize', resize);
    resize();

    let ship = { x: 200, y: 500, w: 32, h: 36, shield: 100, weaponLevel: 1 };
    let bullets = [];
    let enemies = [];
    let particles = [];
    let stars = [];
    let score = 0, wave = 1;
    let isOver = false;
    let shootTimer = 0;

    for (let i = 0; i < 50; i++) {
      stars.push({ x: Math.random() * 800, y: Math.random() * 800, s: Math.random() * 2 + 1, v: Math.random() * 2 + 1 });
    }

    function init() {
      resize();
      ship.x = W / 2;
      ship.y = H - 90;
      ship.shield = 100;
      ship.weaponLevel = 1;
      bullets = [];
      enemies = [];
      particles = [];
      score = 0; wave = 1;
      isOver = false;
      scoreEl.textContent = '0';
      waveEl.textContent = '1';
      shieldEl.textContent = '100%';
      modal.style.display = 'none';
    }

    // Touch / Pointer drag
    canvas.addEventListener('pointermove', (e) => {
      const r = canvas.getBoundingClientRect();
      ship.x = (e.clientX - r.left) * (W / r.width);
      ship.y = (e.clientY - r.top) * (H / r.height);
      ship.x = Math.max(20, Math.min(W - 20, ship.x));
      ship.y = Math.max(50, Math.min(H - 40, ship.y));
    });

    // Keyboard support
    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    function addExplosion(x, y, color = '#f59e0b', count = 12) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const spd = Math.random() * 4 + 1;
        particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: 25, max: 25, color });
      }
    }

    function update() {
      if (isOver) return;

      if (keys['arrowleft'] || keys['a']) ship.x -= 6;
      if (keys['arrowright'] || keys['d']) ship.x += 6;
      if (keys['arrowup'] || keys['w']) ship.y -= 6;
      if (keys['arrowdown'] || keys['s']) ship.y += 6;
      ship.x = Math.max(20, Math.min(W - 20, ship.x));
      ship.y = Math.max(50, Math.min(H - 40, ship.y));

      // Stars scroll
      for (let s of stars) {
        s.y += s.v;
        if (s.y > H) s.y = 0;
      }

      // Auto Fire
      shootTimer++;
      if (shootTimer >= 10) {
        shootTimer = 0;
        if (ship.weaponLevel === 1) {
          bullets.push({ x: ship.x, y: ship.y - 18, vx: 0, vy: -9 });
        } else {
          bullets.push({ x: ship.x - 8, y: ship.y - 18, vx: -0.5, vy: -9 });
          bullets.push({ x: ship.x + 8, y: ship.y - 18, vx: 0.5, vy: -9 });
        }
        snd(700, 0.04, 'triangle');
      }

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx; b.y += b.vy;
        if (b.y < -10) { bullets.splice(i, 1); continue; }

        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) {
            bullets.splice(i, 1);
            e.hp--;
            if (e.hp <= 0) {
              addExplosion(e.x, e.y, e.boss ? '#ef4444' : '#38bdf8', e.boss ? 30 : 12);
              snd(240, 0.15, 'sawtooth');
              score += e.boss ? 500 : 50;
              scoreEl.textContent = score;
              if (score > 1000) ship.weaponLevel = 2;
              enemies.splice(j, 1);
            }
            break;
          }
        }
      }

      // Enemies spawn
      if (Math.random() < 0.04 && enemies.length < 8) {
        enemies.push({
          x: Math.random() * (W - 60) + 30,
          y: -30,
          vx: (Math.random() - 0.5) * 2,
          vy: Math.random() * 2 + 1.5,
          r: 16,
          hp: 1,
          boss: false
        });
      }

      // Enemies update & ship collision
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x += e.vx; e.y += e.vy;
        if (e.x < e.r || e.x > W - e.r) e.vx = -e.vx;

        // Collision with ship
        if (Math.hypot(e.x - ship.x, e.y - ship.y) < e.r + 14) {
          addExplosion(e.x, e.y, '#ef4444', 20);
          enemies.splice(i, 1);
          ship.shield -= 25;
          shieldEl.textContent = `${Math.max(0, ship.shield)}%`;
          snd(120, 0.3, 'sawtooth');

          if (ship.shield <= 0) {
            isOver = true;
            finalScore.textContent = score;
            modal.style.display = 'flex';
            return;
          }
          continue;
        }

        if (e.y > H + 40) enemies.splice(i, 1);
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Stars
      ctx.fillStyle = '#94a3b8';
      for (let s of stars) {
        ctx.fillRect(s.x, s.y, s.s, s.s);
      }

      // Bullets
      ctx.fillStyle = '#38bdf8';
      for (let b of bullets) {
        ctx.fillRect(b.x - 2, b.y, 4, 12);
      }

      // Enemies
      for (let e of enemies) {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();
        // Cyber eyes
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(e.x - 6, e.y - 2, 4, 4);
        ctx.fillRect(e.x + 2, e.y - 2, 4, 4);
      }

      // Ship
      if (!isOver) {
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.moveTo(0, -18);
        ctx.lineTo(16, 14);
        ctx.lineTo(0, 8);
        ctx.lineTo(-16, 14);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Engine thrust
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(-4, 10, 8, 8 + Math.random() * 6);
        ctx.restore();
      }

      // Particles
      for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / p.max;
        ctx.fillRect(p.x, p.y, 3, 3);
      }
      ctx.globalAlpha = 1.0;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    retryBtn.onclick = init;
    init();
    loop();
  </script>
</body>
</html>
