<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Cyber Pong 2-Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html {
      width: 100%; height: 100%;
      background: #060913; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    #game-container {
      position: relative; width: 100%; height: 100%;
      max-width: 800px; max-height: 520px;
      display: flex; flex-direction: column;
    }
    canvas {
      width: 100%; height: 100%; display: block; touch-action: none;
    }
    .hud {
      position: absolute; top: 15px; left: 0; right: 0;
      display: flex; justify-content: space-around;
      pointer-events: none; z-index: 10;
    }
    .score {
      font-size: 48px; font-weight: 900; color: #38bdf8;
      text-shadow: 0 0 20px rgba(56,189,248,0.7);
    }
    .mode-bar {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 20;
    }
    .mode-btn {
      padding: 6px 14px; background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 999px;
      color: #94a3b8; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .mode-btn.active {
      background: #0284c7; color: #fff; border-color: #38bdf8;
    }
    #winner-modal {
      position: absolute; inset: 0;
      background: rgba(6, 9, 19, 0.9); backdrop-filter: blur(8px);
      display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 30;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="mode-bar">
      <button class="mode-btn active" id="btn-1p">1P vs AI</button>
      <button class="mode-btn" id="btn-2p">2P Couch Duel</button>
    </div>

    <div class="hud">
      <div id="s1" class="score" style="color: #38bdf8;">0</div>
      <div id="s2" class="score" style="color: #f43f5e;">0</div>
    </div>

    <canvas id="c"></canvas>

    <div id="winner-modal">
      <div style="font-size: 54px; margin-bottom: 8px;">🏆</div>
      <h1 id="win-text" style="font-size: 32px; font-weight: 900; margin-bottom: 16px;">PLAYER 1 WINS!</h1>
      <button id="rematch-btn" style="padding: 12px 36px; background: #0284c7; border: none; border-radius: 999px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer;">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function snd(f, d = 0.06, type = 'sine') {
      try {
        if (!actx) actx = new AudioCtx();
        if (actx.state === 'suspended') actx.resume();
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, actx.currentTime);
        g.gain.setValueAtTime(0.12, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d);
        o.connect(g); g.connect(actx.destination);
        o.start(); o.stop(actx.currentTime + d);
      } catch(e) {}
    }

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const s1El = document.getElementById('s1');
    const s2El = document.getElementById('s2');
    const winnerModal = document.getElementById('winner-modal');
    const winText = document.getElementById('win-text');
    const rematchBtn = document.getElementById('rematch-btn');

    let W = 0, H = 0;
    function resize() {
      const r = canvas.getBoundingClientRect();
      W = canvas.width = r.width * (window.devicePixelRatio || 1);
      H = canvas.height = r.height * (window.devicePixelRatio || 1);
    }
    window.addEventListener('resize', resize);
    resize();

    let mode = '1p'; // '1p' or '2p'
    let p1 = { y: 200, h: 90, w: 12, vy: 0 };
    let p2 = { y: 200, h: 90, w: 12, vy: 0 };
    let ball = { x: 300, y: 200, vx: 5, vy: 3, r: 8 };
    let s1 = 0, s2 = 0;
    const WIN_SCORE = 7;
    let isOver = false;

    const keys = { w: false, s: false, up: false, down: false };
    window.addEventListener('keydown', (e) => {
      if (e.key === 'w' || e.key === 'W') keys.w = true;
      if (e.key === 's' || e.key === 'S') keys.s = true;
      if (e.key === 'ArrowUp') { e.preventDefault(); keys.up = true; }
      if (e.key === 'ArrowDown') { e.preventDefault(); keys.down = true; }
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'w' || e.key === 'W') keys.w = false;
      if (e.key === 's' || e.key === 'S') keys.s = false;
      if (e.key === 'ArrowUp') keys.up = false;
      if (e.key === 'ArrowDown') keys.down = false;
    });

    // Touch support (drag left side for P1, right side for P2)
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      for (let i = 0; i < e.touches.length; i++) {
        const t = e.touches[i];
        const tx = (t.clientX - rect.left) * (W / rect.width);
        const ty = (t.clientY - rect.top) * (H / rect.height);
        if (tx < W / 2) {
          p1.y = ty - p1.h / 2;
        } else {
          p2.y = ty - p2.h / 2;
        }
      }
    }, { passive: false });

    document.getElementById('btn-1p').onclick = () => { mode = '1p'; document.getElementById('btn-1p').classList.add('active'); document.getElementById('btn-2p').classList.remove('active'); resetMatch(); };
    document.getElementById('btn-2p').onclick = () => { mode = '2p'; document.getElementById('btn-2p').classList.add('active'); document.getElementById('btn-1p').classList.remove('active'); resetMatch(); };
    rematchBtn.onclick = resetMatch;

    function resetBall(servingP = 1) {
      ball.x = W / 2;
      ball.y = H / 2;
      const spd = 6;
      ball.vx = (servingP === 1 ? 1 : -1) * spd;
      ball.vy = (Math.random() - 0.5) * 4;
    }

    function resetMatch() {
      s1 = 0; s2 = 0;
      s1El.textContent = '0'; s2El.textContent = '0';
      p1.y = H / 2 - p1.h / 2;
      p2.y = H / 2 - p2.h / 2;
      isOver = false;
      winnerModal.style.display = 'none';
      resetBall();
    }

    function update() {
      if (isOver) return;

      // P1 movement
      if (keys.w) p1.y -= 7;
      if (keys.s) p1.y += 7;

      // P2 movement
      if (mode === '2p') {
        if (keys.up) p2.y -= 7;
        if (keys.down) p2.y += 7;
      } else {
        // AI movement with slight lag
        const targetY = ball.y - p2.h / 2;
        p2.y += (targetY - p2.y) * 0.12;
      }

      // Constrain paddles
      p1.y = Math.max(0, Math.min(H - p1.h, p1.y));
      p2.y = Math.max(0, Math.min(H - p2.h, p2.y));

      // Ball move
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top / bottom wall bounce
      if (ball.y - ball.r <= 0 || ball.y + ball.r >= H) {
        ball.vy = -ball.vy;
        snd(340, 0.04);
      }

      // P1 collision (left paddle at x = 30)
      const p1x = 30;
      if (
        ball.x - ball.r <= p1x + p1.w &&
        ball.x + ball.r >= p1x &&
        ball.y >= p1.y &&
        ball.y <= p1.y + p1.h &&
        ball.vx < 0
      ) {
        ball.vx = Math.abs(ball.vx) * 1.05; // speed up
        const offset = (ball.y - (p1.y + p1.h / 2)) / (p1.h / 2);
        ball.vy = offset * 6;
        snd(520, 0.06);
      }

      // P2 collision (right paddle at x = W - 30 - p2.w)
      const p2x = W - 30 - p2.w;
      if (
        ball.x + ball.r >= p2x &&
        ball.x - ball.r <= p2x + p2.w &&
        ball.y >= p2.y &&
        ball.y <= p2.y + p2.h &&
        ball.vx > 0
      ) {
        ball.vx = -Math.abs(ball.vx) * 1.05;
        const offset = (ball.y - (p2.y + p2.h / 2)) / (p2.h / 2);
        ball.vy = offset * 6;
        snd(520, 0.06);
      }

      // Goal scoring
      if (ball.x < 0) {
        s2++;
        s2El.textContent = s2;
        snd(220, 0.2, 'sawtooth');
        checkWin();
        resetBall(1);
      } else if (ball.x > W) {
        s1++;
        s1El.textContent = s1;
        snd(660, 0.2, 'triangle');
        checkWin();
        resetBall(2);
      }
    }

    function checkWin() {
      if (s1 >= WIN_SCORE || s2 >= WIN_SCORE) {
        isOver = true;
        winText.textContent = s1 >= WIN_SCORE ? (mode === '1p' ? 'YOU WIN!' : 'PLAYER 1 WINS!') : (mode === '1p' ? 'AI WINS!' : 'PLAYER 2 WINS!');
        winnerModal.style.display = 'flex';
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Center dashed net
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 4;
      ctx.setLineDash([12, 12]);
      ctx.beginPath();
      ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H);
      ctx.stroke();
      ctx.setLineDash([]);

      // Paddles
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 10;
      ctx.fillRect(30, p1.y, p1.w, p1.h);

      ctx.fillStyle = '#f43f5e';
      ctx.shadowColor = '#f43f5e';
      ctx.fillRect(W - 30 - p2.w, p2.y, p2.w, p2.h);

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    resetMatch();
    loop();
  </script>
</body>
</html>
