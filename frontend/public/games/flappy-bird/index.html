<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Flappy Bird Neon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html {
      width: 100%; height: 100%;
      background: #090d16;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      max-height: 800px;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    .hud {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }
    .score-badge {
      font-size: 42px;
      font-weight: 900;
      color: #f8fafc;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.8), 0 4px 8px rgba(0,0,0,0.8);
      font-variant-numeric: tabular-nums;
    }
    #start-overlay, #gameover-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 15, 29, 0.85);
      backdrop-filter: blur(8px);
      z-index: 20;
      text-align: center;
      padding: 24px;
    }
    .btn {
      margin-top: 24px;
      padding: 14px 36px;
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      color: #04101e;
      font-size: 18px;
      font-weight: 800;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud">
      <div id="score" class="score-badge">0</div>
    </div>
    <canvas id="c"></canvas>

    <div id="start-overlay">
      <div style="font-size: 64px; margin-bottom: 12px; filter: drop-shadow(0 0 20px #38bdf8);">🪶</div>
      <h1 style="font-size: 32px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 8px;">FLAPPY NEON</h1>
      <p style="color: #94a3b8; font-size: 15px; max-width: 260px; line-height: 1.4;">
        Tap, click, or press Spacebar to flap through the cyber conduits!
      </p>
      <button class="btn" id="start-btn">TAP TO FLY</button>
    </div>

    <div id="gameover-overlay" style="display: none;">
      <div style="font-size: 50px; margin-bottom: 10px;">⚡</div>
      <h2 style="font-size: 28px; font-weight: 900; color: #f43f5e; margin-bottom: 16px;">CIRCUIT BREACH</h2>
      <div style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; width: 220px; margin-bottom: 8px;">
        <div style="font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 700;">Score</div>
        <div id="final-score" style="font-size: 36px; font-weight: 900; color: #38bdf8; margin-bottom: 10px;">0</div>
        <div style="font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 700;">Best Score</div>
        <div id="best-score" style="font-size: 24px; font-weight: 800; color: #f59e0b;">0</div>
      </div>
      <button class="btn" id="restart-btn">RETRY</button>
    </div>
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function sound(freq, dur = 0.1, type = 'sine') {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const startOverlay = document.getElementById('start-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreEl = document.getElementById('best-score');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let W = 0, H = 0;
    function resize() {
      const rect = canvas.getBoundingClientRect();
      W = canvas.width = rect.width * (window.devicePixelRatio || 1);
      H = canvas.height = rect.height * (window.devicePixelRatio || 1);
    }
    window.addEventListener('resize', resize);
    resize();

    let state = 'idle'; // idle | playing | over
    let bird = { x: 80, y: 300, vy: 0, radius: 16 };
    let pipes = [];
    let score = 0;
    let best = parseInt(localStorage.getItem('gh_flappy_best') || '0', 10);
    let frame = 0;
    const GRAVITY = 0.38;
    const JUMP = -7.2;
    const PIPE_SPEED = 2.8;
    const PIPE_GAP = 140;

    function jump() {
      if (state === 'idle') {
        state = 'playing';
        startOverlay.style.display = 'none';
      }
      if (state === 'playing') {
        bird.vy = JUMP;
        sound(520, 0.08, 'square');
      }
    }

    function reset() {
      bird.y = H * 0.4;
      bird.vy = 0;
      bird.x = W * 0.25;
      bird.radius = W * 0.04;
      pipes = [];
      score = 0;
      scoreEl.textContent = '0';
      state = 'playing';
      startOverlay.style.display = 'none';
      gameoverOverlay.style.display = 'none';
      jump();
    }

    startBtn.addEventListener('click', (e) => { e.stopPropagation(); reset(); });
    restartBtn.addEventListener('click', (e) => { e.stopPropagation(); reset(); });
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (state === 'over') reset();
        else jump();
      }
    });
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (state === 'over') return;
      jump();
    });

    function addPipe() {
      const minH = H * 0.12;
      const maxH = H * 0.55;
      const topH = Math.random() * (maxH - minH) + minH;
      pipes.push({
        x: W,
        top: topH,
        bottom: topH + PIPE_GAP,
        passed: false,
        width: W * 0.14
      });
    }

    function gameOver() {
      state = 'over';
      sound(150, 0.4, 'sawtooth');
      finalScoreEl.textContent = score;
      if (score > best) {
        best = score;
        localStorage.setItem('gh_flappy_best', best);
      }
      bestScoreEl.textContent = best;
      gameoverOverlay.style.display = 'flex';
    }

    function update() {
      if (state !== 'playing') return;
      frame++;

      bird.vy += GRAVITY;
      bird.y += bird.vy;

      // Ground / Ceiling collision
      if (bird.y + bird.radius >= H - 20) {
        bird.y = H - 20 - bird.radius;
        gameOver();
      }
      if (bird.y - bird.radius <= 0) {
        bird.y = bird.radius;
        bird.vy = 0;
      }

      // Pipe spawn
      if (frame % 85 === 0) {
        addPipe();
      }

      // Pipe update & collision
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= PIPE_SPEED;

        // Collision check
        if (
          bird.x + bird.radius > p.x &&
          bird.x - bird.radius < p.x + p.width
        ) {
          if (bird.y - bird.radius < p.top || bird.y + bird.radius > p.bottom) {
            gameOver();
            return;
          }
        }

        // Score update
        if (!p.passed && p.x + p.width < bird.x) {
          p.passed = true;
          score++;
          scoreEl.textContent = score;
          sound(780, 0.12, 'sine');
        }

        if (p.x + p.width < -10) {
          pipes.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Background stars & cyber lines
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, W, H);

      // Distant grid
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.08)';
      ctx.lineWidth = 1;
      for (let y = 0; y < H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      // Pipes (Neon Energy Columns)
      for (const p of pipes) {
        // Top pipe
        const gradTop = ctx.createLinearGradient(p.x, 0, p.x + p.width, 0);
        gradTop.addColorStop(0, '#0284c7');
        gradTop.addColorStop(0.5, '#38bdf8');
        gradTop.addColorStop(1, '#0369a1');
        ctx.fillStyle = gradTop;
        ctx.fillRect(p.x, 0, p.width, p.top);

        // Pipe cap
        ctx.fillStyle = '#7dd3fc';
        ctx.fillRect(p.x - 3, p.top - 12, p.width + 6, 12);

        // Bottom pipe
        const gradBot = ctx.createLinearGradient(p.x, 0, p.x + p.width, 0);
        gradBot.addColorStop(0, '#0284c7');
        gradBot.addColorStop(0.5, '#38bdf8');
        gradBot.addColorStop(1, '#0369a1');
        ctx.fillStyle = gradBot;
        ctx.fillRect(p.x, p.bottom, p.width, H - p.bottom);

        // Bottom cap
        ctx.fillStyle = '#7dd3fc';
        ctx.fillRect(p.x - 3, p.bottom, p.width + 6, 12);
      }

      // Ground
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, H - 20, W, 20);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(0, H - 20, W, 2);

      // Draw Bird (Cyber Drone)
      ctx.save();
      ctx.translate(bird.x, bird.y);
      const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.vy / 10) * 0.8));
      ctx.rotate(angle);

      // Glow
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 15;

      // Body
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();

      // Wing
      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.ellipse(-bird.radius * 0.3, Math.sin(frame * 0.3) * 4, bird.radius * 0.5, bird.radius * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(bird.radius * 0.4, -bird.radius * 0.3, bird.radius * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(bird.radius * 0.5, -bird.radius * 0.3, bird.radius * 0.15, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(bird.radius * 0.7, -bird.radius * 0.1);
      ctx.lineTo(bird.radius * 1.3, bird.radius * 0.1);
      ctx.lineTo(bird.radius * 0.7, bird.radius * 0.3);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
