<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Sudoku Master</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html {
      width: 100%; height: 100%;
      background: #0b0f19; color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    #game-container {
      position: relative; width: 100%; height: 100%;
      max-width: 500px; max-height: 780px;
      padding: 12px; display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
    }
    .header {
      width: 100%; display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 8px;
    }
    .diff-select {
      background: #1e293b; color: #38bdf8; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; padding: 4px 10px; font-weight: 700; font-size: 13px;
    }
    .timer { font-size: 16px; font-weight: 800; color: #94a3b8; font-variant-numeric: tabular-nums; }
    .grid {
      width: 100%; aspect-ratio: 1;
      display: grid; grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      background: #334155; border: 2.5px solid #38bdf8;
      border-radius: 8px; overflow: hidden;
      gap: 1px;
    }
    .cell {
      background: #0f172a; display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; cursor: pointer;
      color: #38bdf8; transition: background 0.1s;
    }
    .cell.initial { color: #f8fafc; font-weight: 900; }
    .cell.selected { background: #1e3a8a !important; color: #fff; }
    .cell.same-num { background: #1e293b; }
    .cell.error { background: rgba(239, 68, 68, 0.3) !important; color: #ef4444; }
    .cell.border-right { border-right: 2px solid #38bdf8; }
    .cell.border-bottom { border-bottom: 2px solid #38bdf8; }
    .keypad {
      width: 100%; display: grid; grid-template-columns: repeat(9, 1fr);
      gap: 6px; margin-top: 10px;
    }
    .k-btn {
      aspect-ratio: 1; background: #1e293b; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; color: #f8fafc; font-size: 20px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .k-btn:active { background: #38bdf8; color: #000; transform: scale(0.94); }
    .actions {
      width: 100%; display: flex; justify-content: space-between;
      gap: 8px; margin-top: 8px;
    }
    .act-btn {
      flex: 1; padding: 10px; background: #1e293b; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; color: #94a3b8; font-size: 14px; font-weight: 700;
      cursor: pointer; text-align: center;
    }
    .act-btn:active { background: #334155; color: #fff; }
    #modal {
      position: absolute; inset: 0; background: rgba(11, 15, 25, 0.92);
      backdrop-filter: blur(8px); display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 30; text-align: center;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="header">
      <select id="diff" class="diff-select">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <div id="mistakes" style="font-size: 14px; color: #ef4444; font-weight: bold;">Mistakes: 0/3</div>
      <div id="timer" class="timer">00:00</div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="actions">
      <button class="act-btn" id="erase-btn">🧹 Erase</button>
      <button class="act-btn" id="hint-btn">💡 Hint</button>
      <button class="act-btn" id="new-btn">🔄 New Game</button>
    </div>

    <div class="keypad" id="keypad"></div>

    <div id="modal">
      <div style="font-size: 50px; margin-bottom: 12px;">🎉</div>
      <h1 id="modal-title" style="font-size: 28px; font-weight: 900; color: #38bdf8; margin-bottom: 8px;">PUZZLE SOLVED!</h1>
      <p id="modal-desc" style="color: #94a3b8; margin-bottom: 20px;">Time: <span id="win-time"></span></p>
      <button id="again-btn" style="padding: 12px 36px; background: #38bdf8; color: #000; border: none; font-size: 16px; font-weight: bold; border-radius: 999px; cursor: pointer;">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    // Audio feedback
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function snd(f, d = 0.06, type = 'sine') {
      try {
        if (!actx) actx = new AudioCtx();
        if (actx.state === 'suspended') actx.resume();
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, actx.currentTime);
        g.gain.setValueAtTime(0.08, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d);
        o.connect(g); g.connect(actx.destination);
        o.start(); o.stop(actx.currentTime + d);
      } catch(e) {}
    }

    // Solved template board for valid permutations
    const BASE_SOLUTION = [
      [5,3,4,6,7,8,9,1,2],
      [6,7,2,1,9,5,3,4,8],
      [1,9,8,3,4,2,5,6,7],
      [8,5,9,7,6,1,4,2,3],
      [4,2,6,8,5,3,7,9,1],
      [7,1,3,9,2,4,8,5,6],
      [9,6,1,5,3,7,2,8,4],
      [2,8,7,4,1,9,6,3,5],
      [3,4,5,2,8,6,1,7,9]
    ];

    let solution = [];
    let initialGrid = [];
    let currentGrid = [];
    let selectedCell = null;
    let mistakes = 0;
    let seconds = 0;
    let timerId = null;

    const gridEl = document.getElementById('grid');
    const keypadEl = document.getElementById('keypad');
    const timerEl = document.getElementById('timer');
    const mistakesEl = document.getElementById('mistakes');
    const modal = document.getElementById('modal');
    const againBtn = document.getElementById('again-btn');

    // Create Keypad (1 to 9)
    for (let i = 1; i <= 9; i++) {
      const btn = document.createElement('div');
      btn.className = 'k-btn';
      btn.textContent = i;
      btn.onclick = () => fillCell(i);
      keypadEl.appendChild(btn);
    }

    function generateBoard() {
      // Shuffle digits
      const digits = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
      solution = BASE_SOLUTION.map(row => row.map(val => digits[val - 1]));

      // Create puzzle by hiding cells based on difficulty
      const diff = document.getElementById('diff').value;
      const clues = diff === 'easy' ? 42 : diff === 'medium' ? 32 : 25;
      
      initialGrid = solution.map(r => [...r]);
      const totalToRemove = 81 - clues;
      let removed = 0;
      while (removed < totalToRemove) {
        const r = Math.floor(Math.random() * 9);
        const c = Math.floor(Math.random() * 9);
        if (initialGrid[r][c] !== 0) {
          initialGrid[r][c] = 0;
          removed++;
        }
      }
      currentGrid = initialGrid.map(r => [...r]);
    }

    function renderGrid() {
      gridEl.innerHTML = '';
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const val = currentGrid[r][c];
          const isInitial = initialGrid[r][c] !== 0;
          const cell = document.createElement('div');
          cell.className = 'cell';
          if (isInitial) cell.classList.add('initial');
          if ((c + 1) % 3 === 0 && c < 8) cell.classList.add('border-right');
          if ((r + 1) % 3 === 0 && r < 8) cell.classList.add('border-bottom');
          if (val !== 0) cell.textContent = val;

          if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
            cell.classList.add('selected');
          } else if (selectedCell && val !== 0 && val === currentGrid[selectedCell.r][selectedCell.c]) {
            cell.classList.add('same-num');
          }

          cell.onclick = () => {
            selectedCell = { r, c };
            renderGrid();
          };
          gridEl.appendChild(cell);
        }
      }
    }

    function fillCell(num) {
      if (!selectedCell) return;
      const { r, c } = selectedCell;
      if (initialGrid[r][c] !== 0) return; // cannot edit initial clues

      if (solution[r][c] === num) {
        currentGrid[r][c] = num;
        snd(580, 0.08);
        renderGrid();
        checkVictory();
      } else {
        mistakes++;
        mistakesEl.textContent = `Mistakes: ${mistakes}/3`;
        snd(160, 0.25, 'sawtooth');
        if (mistakes >= 3) {
          clearInterval(timerId);
          modal.style.display = 'flex';
          document.getElementById('modal-title').textContent = 'GAME OVER';
          document.getElementById('modal-title').style.color = '#ef4444';
          document.getElementById('modal-desc').textContent = 'You exceeded 3 mistakes.';
        }
      }
    }

    function eraseCell() {
      if (!selectedCell) return;
      const { r, c } = selectedCell;
      if (initialGrid[r][c] !== 0) return;
      currentGrid[r][c] = 0;
      renderGrid();
    }

    function giveHint() {
      if (!selectedCell) return;
      const { r, c } = selectedCell;
      if (initialGrid[r][c] !== 0) return;
      currentGrid[r][c] = solution[r][c];
      snd(720, 0.12);
      renderGrid();
      checkVictory();
    }

    function checkVictory() {
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          if (currentGrid[r][c] !== solution[r][c]) return;
        }
      }
      clearInterval(timerId);
      document.getElementById('win-time').textContent = timerEl.textContent;
      document.getElementById('modal-title').textContent = 'PUZZLE SOLVED!';
      document.getElementById('modal-title').style.color = '#38bdf8';
      modal.style.display = 'flex';
      snd(880, 0.3, 'triangle');
    }

    function startNewGame() {
      clearInterval(timerId);
      seconds = 0;
      mistakes = 0;
      mistakesEl.textContent = 'Mistakes: 0/3';
      timerEl.textContent = '00:00';
      selectedCell = null;
      modal.style.display = 'none';
      generateBoard();
      renderGrid();

      timerId = setInterval(() => {
        seconds++;
        const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        timerEl.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= 9) fillCell(n);
      if (e.key === 'Backspace' || e.key === 'Delete') eraseCell();
    });

    document.getElementById('erase-btn').onclick = eraseCell;
    document.getElementById('hint-btn').onclick = giveHint;
    document.getElementById('new-btn').onclick = startNewGame;
    document.getElementById('diff').onchange = startNewGame;
    againBtn.onclick = startNewGame;

    startNewGame();
  </script>
</body>
</html>
